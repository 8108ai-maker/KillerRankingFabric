# Build and test on every push / pull request, keep the jar as a run artifact, and (for pushes) also
# publish the built jar to the orphan `artifacts` branch so it can be fetched with plain git.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --no-daemon --console=plain
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: publish jar to the artifacts branch
        if: github.event_name == 'push'
        run: |
          set -e
          out=$(mktemp -d)
          cp build/libs/killerranking-*.jar "$out"/
          echo "$GITHUB_SHA" > "$out"/BUILD_SHA
          cd "$out"
          git init -q -b artifacts
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -q -m "jar from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" artifacts
